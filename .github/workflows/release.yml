name: Test and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  AP_VERSION: "0.6.8"
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check out Archipelago ${{ env.AP_VERSION }}
        uses: actions/checkout@v5
        with:
          repository: ArchipelagoMW/Archipelago
          ref: ${{ env.AP_VERSION }}
          path: Archipelago

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Archipelago dependencies
        working-directory: Archipelago
        run: |
          python -m pip install --upgrade pip -r ci-requirements.txt
          python ModuleUpdate.py --yes --force --append "WebHostLib/requirements.txt"

      - name: Add the world to Archipelago
        run: cp -r apworld/voidling_bound Archipelago/worlds/voidling_bound

      - name: Run world and generic tests
        working-directory: Archipelago
        run: |
          set -o pipefail
          python -m pytest -q -rf worlds/voidling_bound/test test/general 2>&1 | tee pytest.log

      # Job logs need a GitHub login, annotations don't: put the failures where anyone can read them.
      - name: Report failed tests
        if: failure()
        working-directory: Archipelago
        run: |
          grep -E "^(FAILED|ERROR) " pytest.log | head -20 | sed 's/^/::error::/' || true
          grep -E "^E  " pytest.log | head -30 | sed 's/^/::error::/' || true

  mod-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run the Lua mod against stubbed UE4SS
        run: |
          python -m pip install lupa
          python mod/tests/test_mod.py

      - name: Test the gene import tool
        run: |
          python tools/test_import_genes.py
          python tools/test_import_variants.py

  release:
    needs: [test, mod-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Tags like v2.3.0-beta.1 are test releases of 2.3.0: published as pre-releases with the 2.3.0 notes.
      - name: Check the tag matches the world version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%%-*}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          WORLD_VERSION=$(python -c "import json; print(json.load(open('apworld/voidling_bound/archipelago.json'))['world_version'])")
          if [ "$VERSION" != "$WORLD_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match world_version $WORLD_VERSION in archipelago.json"
            exit 1
          fi

      - name: Build release files
        run: |
          python build_release.py
          # Pre-releases are for testers, they also get the developer tools
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then cp mod/devtools/discovery.lua dist/; fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found && !/^\[[^]]+\]: / { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::No CHANGELOG.md entry for $VERSION"
            exit 1
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Voidlingpelago ${{ github.ref_name }}
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/voidling_bound.apworld
            dist/Voidlingpelago.zip
            dist/Voidling Bound.yaml
            dist/discovery.lua
